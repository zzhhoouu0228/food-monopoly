<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食大富翁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 全螢幕彩帶特效畫布 -->
    <canvas id="fx-canvas"></canvas>

    <header class="top-bar">
        <div class="brand">
            <span class="logo-icon">🎲</span>
            <h1>淡江美食大富翁</h1>
        </div>
        <div class="header-actions">
            <button id="add-player-btn" class="icon-btn" title="新增一位玩家（最多4人）">+ 玩家</button>
            <button id="remove-player-btn" class="icon-btn" title="減少最後一位玩家">- 玩家</button>
            <button id="reset-players-btn" class="icon-btn" title="將玩家人數與名稱還原為預設 2 人">👥 重置玩家</button>
            <button id="reset-btn" class="icon-btn danger" title="將目前所有棋子退回起點 GO，保留評論">↺ 重置棋盤</button>
            <button id="clear-history-btn" class="icon-btn danger" title="清空所有歷史評論紀錄">🗑️ 清空評論</button>
        </div>
    </header>

    <main class="game-layout">
        <!-- 左側：經典 7x7 環狀大富翁棋盤 -->
        <section class="board-wrapper">
            <div class="board" id="board">
                <!-- 棋盤中央控制台 -->
                <div class="center-hub">
                    <div class="board-watermark">美食大富翁</div>

                    <div class="player-turn-bar" id="player-status" title="點擊玩家名稱可自訂暱稱"></div>

                    <!-- 3D 單顆六面骰區 (D6) -->
                    <div class="dice-stage">
                        <div class="scene">
                            <div class="cube" id="cube-1">
                                <div class="face face-1"><span class="pip"></span></div>
                                <div class="face face-2"><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-3"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                                <div class="face face-4"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span></div>
                                <div class="face face-5"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                                <div class="face face-6"><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span><span class="pip"></span><span class="pip"></span><span
                                        class="pip"></span></div>
                            </div>
                        </div>
                    </div>

                    <div class="status-banner" id="dice-result">輪到 玩家 1</div>

                    <button id="roll-btn" class="roll-btn">
                        <span>🎲 擲骰</span>
                    </button>
                </div>

                <!-- 獨立棋子動畫圖層 -->
                <div class="token-layer" id="token-layer"></div>
            </div>
        </section>

        <!-- 右側：淡江店家評論與點餐攻略牆 -->
        <aside class="checkin-wall">
            <div class="wall-tabs">
                <button id="tab-store" class="wall-tab active">🏪 單店攻略</button>
                <button id="tab-all" class="wall-tab">💬 全部評論</button>
            </div>

            <div class="wall-header">
                <div class="wall-title-group">
                    <h2 id="wall-title">⭐ 店家點餐攻略</h2>
                    <p id="wall-subtitle" class="wall-subtitle">點擊棋盤店家或下方選單查看推薦菜色</p>
                </div>
                <div class="wall-header-actions">
                    <span class="count-badge" id="checkin-count">0 則</span>
                    <button id="open-review-btn" class="write-review-btn">✍️ 寫評論</button>
                </div>
            </div>

            <!-- 店家快速篩選下拉選單 -->
            <div class="category-bar" id="category-bar">
                <select id="category-select" class="category-select">
                    <option value="all">🌟 全部店家評論</option>
                </select>
            </div>

            <!-- 單店平均分數摘要卡 -->
            <div id="store-summary" class="store-summary hidden"></div>

            <div id="feed-list" class="feed-list"></div>
        </aside>
    </main>

    <!-- 彈窗 1：擲骰結果與今日晚餐定案視窗 -->
    <div id="decision-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-hero" id="decision-hero">🍜</div>
            <span id="decision-badge" class="badge">🎯 今日晚餐決定</span>
            <h3 id="decision-title">欣宏牛肉麵</h3>
            <p id="decision-desc">看看大家過去推薦點什麼，準備出發開吃！</p>

            <!-- 該店家的歷史評價與推薦菜色預覽 -->
            <div id="decision-preview" class="decision-preview"></div>

            <div class="modal-actions">
                <button type="button" id="reroll-btn" class="secondary-btn">🔄 公休 / 重擲一次</button>
                <button type="button" id="confirm-eat-btn" class="roll-btn">🎉 就吃這家！（換下一位）</button>
            </div>
        </div>
    </div>

    <!-- 彈窗 2：新增 / 編輯店家評論視窗 -->
    <div id="review-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-hero">✍️</div>
            <span class="badge">吃完來評分</span>
            <h3 id="review-modal-title">新增評論</h3>
            <p>留下分數推薦餐點，給下次抽到的隊友參考！</p>

            <form id="review-form" class="checkin-form">
                <input type="hidden" id="edit-record-id" value="">

                <div class="rating-group">
                    <label for="review-store-select">🏪 選擇店家：</label>
                    <select id="review-store-select" class="score-select" required></select>
                </div>

                <div class="rating-group">
                    <label for="food-score">⭐ 給予店家分數：</label>
                    <select id="food-score" class="score-select" required>
                        <option value="5">⭐⭐⭐⭐⭐ 5 分（極力推薦）</option>
                        <option value="4">⭐⭐⭐⭐ 4 分（好吃推推）</option>
                        <option value="3">⭐⭐⭐ 3 分（中規中矩）</option>
                        <option value="2">⭐⭐ 2 分（普通偏雷）</option>
                        <option value="1">⭐ 1 分（不推踩雷）</option>
                    </select>
                </div>

                <div class="rating-group">
                    <label for="food-comment">💬 推薦菜色：</label>
                    <textarea id="food-comment" rows="3" placeholder="例如：紅燒牛肉麵湯頭超濃、加麵不加價，練完球吃超飽！" required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-review-btn" class="secondary-btn">取消</button>
                    <button type="submit" class="roll-btn">儲存評論</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
